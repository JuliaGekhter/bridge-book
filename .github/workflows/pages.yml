name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (decode PNG icons stored as base64)
        run: |
          mkdir -p _site/icons
          cp index.html styles.css app.js manifest.json sw.js robots.txt .nojekyll _site/
          for f in icons/*.png.b64; do
            base64 -d "$f" > "_site/icons/$(basename "$f" .b64)"
          done
          ls -la _site _site/icons
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
